<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="#0f172a" />
  
  <!-- Cloud Shape -->
  <path d="M 50 25 C 38 25 30 34 28 44 C 18 45 12 53 12 62 C 12 72 20 78 30 78 L 72 78 C 82 78 88 70 88 60 C 88 50 82 43 72 42 C 68 32 58 25 50 25 Z" fill="url(#grad)" filter="url(#glow)"/>
  
  <!-- Play/Download Icon inside Cloud -->
  <path d="M 50 42 L 50 64 M 38 54 L 50 66 L 62 54" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
